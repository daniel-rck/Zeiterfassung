<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="Zeiterfassung — Timer, Projekte und Reports im Browser. Lokale Daten, kein Account, DSGVO-konform."
    />
    <title>Zeiterfassung</title>
    <script>
      // Apply the theme before React mounts so the dark/light background does
      // not flash on every page load.
      (function () {
        try {
          var raw = localStorage.getItem('zeiterfassung:settings')
          var theme = raw ? JSON.parse(raw).theme : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">Zum Hauptinhalt springen</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
